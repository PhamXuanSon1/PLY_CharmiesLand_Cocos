<div id="app">
  <header>
    <h2>Grid Arrange Tool</h2>
    <div class="hint">Chọn node cha chứa các item trong Hierarchy, tải danh sách, sắp xếp thứ tự spawn rồi Apply để xếp lưới và cập nhật ItemManager.</div>
  </header>
  <div class="row"><strong id="parentName" class="grow">Chưa tải danh sách</strong><ui-button id="load">Tải từ node đang chọn</ui-button></div>
  <div id="spawnMode" class="hint"></div>
  <section class="settings">
    <label>Cột <input id="columns" type="number" min="1" value="4"></label>
    <label>Gap X <input id="spacingX" type="number" value="20"></label>
    <label>Gap Y <input id="spacingY" type="number" value="20"></label>
    <label>Start X <input id="startX" type="number" value="0"></label>
    <label>Start Y <input id="startY" type="number" value="0"></label>
    <label class="check"><input id="centerGrid" type="checkbox" checked> Căn giữa lưới tại Start</label>
    <label class="check"><input id="skipInactive" type="checkbox"> Bỏ qua node inactive khi xếp</label>
  </section>
  <div class="listhead"><strong>Xem trước lưới · Thứ tự spawn</strong><span class="hint">Kéo thả thẻ để đổi vị trí</span></div>
  <div id="list" class="list" role="list"><div class="empty">Chọn node cha rồi bấm Tải.</div></div>
  <footer><span id="status" class="hint grow"></span><ui-button id="apply" type="primary" disabled>Apply / Cập nhật ItemManager</ui-button></footer>
</div>
